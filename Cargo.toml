[package]
name        = "hammer"
version     = "0.3.0"
edition     = "2021"
authors     = ["HackerOS Team <hackeros068@gmail.com>"]
description = "Atomic Debian package manager — HackerOS"
license     = "Apache-2.0"
repository  = "https://github.com/HackerOS-Linux-System/hammer"

[[bin]]
name = "hammer"
path = "source-code/main.rs"

[dependencies]
anyhow          = "1"
tokio           = { version = "1", features = ["full"] }
reqwest         = { version = "0.11", default-features = false, features = [
                    "json", "gzip", "deflate", "stream", "rustls-tls"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
toml            = "0.5"
rusqlite        = { version = "0.31", features = ["bundled"] }
chrono          = { version = "0.4", features = ["serde"] }
indicatif       = "0.17"
owo-colors      = "3"
lexopt          = "0.3"
tar             = "0.4"
flate2          = "1"
xz2             = "0.1"
bzip2           = "0.4"
zstd            = "0.13"
futures-util    = "0.3"
terminal_size   = "0.3"
libc            = "0.2"
sha2            = "0.10"
sha1            = "0.10"
hex             = "0.4"
walkdir         = "2"
nix             = { version = "0.27", features = ["user"] }
hk-parser       = "0.3.0"
indexmap        = { version = "2", features = ["serde"] }
resolvo         = "0.4"
fslock          = "0.2"

# ── New dependencies for expanded modules ─────────────────────

# audit.rs — Ed25519 signing via ed25519-dalek
ed25519-dalek   = { version = "2", features = ["rand_core"] }
rand_core       = { version = "0.6", features = ["getrandom"] }
getrandom       = { version = "0.2", features = ["std"] }

# audit.rs — HMAC fallback (keep for compatibility)
hmac            = "0.12"

# store_v2.rs — ZFS backend uses process::Command (no extra dep needed)
# mirror.rs   — resumable downloads use reqwest (already present)
# sandbox.rs  — uses std::process::Command (no extra dep)
# notify.rs   — uses std::process::Command (no extra dep)
